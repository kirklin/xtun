[package]
name = "xtun-wire"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "The bytes of batched and offloaded packet I/O, without any device: checksums, cutting segments, joining packets and the prefixes devices put in front of frames"
license = "MIT"
repository = "https://github.com/kirklin/xtun"
keywords = ["checksum", "gso", "packet", "tun", "tap"]
categories = ["network-programming"]

[dev-dependencies]
proptest = "1.12"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
