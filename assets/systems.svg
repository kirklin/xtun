<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 520" width="1320" height="520">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fff; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 30px; font-weight: 600; }
    .code { font-size: 20px; fill: #e6e6e6; }
    .call { fill: #4F9BF7; }
    .dim { fill: #9a9a9a; }
    .panel { fill: #0e0e0e; stroke: #2e2e2e; stroke-width: 1.5; }
    .chip { fill: #5C5C5C; stroke: #fff; stroke-opacity: 0.9; stroke-width: 1.5; }
    .system { font-size: 18px; font-weight: 500; }
    .note { font-size: 13.5px; fill: #9a9a9a; }
    .caption { font-size: 22px; font-style: italic; fill: #e6e6e6; }
    .tree { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
  </style>
  <rect width="1320" height="520" fill="#000"/>

  <text class="title" x="32" y="48">One interface, nine systems</text>

  <rect class="panel" x="32" y="84" width="1256" height="160" rx="14"/>
  <g xml:space="preserve">
    <text class="mono code" x="64" y="126"><tspan class="dim">let</tspan> (tun, <tspan class="dim">mut</tspan> queues) = <tspan class="call">Tun::builder()</tspan>.address(net).<tspan class="call">build()</tspan>?;</text>
    <text class="mono code" x="64" y="156"><tspan class="dim">let</tspan> (<tspan class="dim">mut</tspan> reader, <tspan class="dim">mut</tspan> writer) = queues.remove(0).<tspan class="call">split()</tspan>?;</text>
    <text class="mono code" x="64" y="186"><tspan class="dim">let mut</tspan> batch = reader.<tspan class="call">recv()</tspan>.<tspan class="dim">await</tspan>?;</text>
    <text class="mono code" x="64" y="216">writer.<tspan class="call">send(&amp;packets)</tspan>.<tspan class="dim">await</tspan>?;</text>
  </g>

  <path class="tree" d="M660 244V268M96 292V268H1224V292M237 268V292M378 268V292M519 268V292M660 268V292M801 268V292M942 268V292M1083 268V292"/>

  <g text-anchor="middle">
    <rect class="chip" x="32" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="96" y="326">Linux</text>
    <text class="mono note" x="96" y="374">/dev/net/tun</text>
    <text class="mono note" x="96" y="394">io_uring</text>

    <rect class="chip" x="173" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="237" y="326">Android</text>
    <text class="mono note" x="237" y="374">/dev/tun</text>
    <text class="mono note" x="237" y="394">from_fd</text>

    <rect class="chip" x="314" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="378" y="326">macOS</text>
    <text class="mono note" x="378" y="374">utun</text>
    <text class="mono note" x="378" y="394">feth + BPF</text>

    <rect class="chip" x="455" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="519" y="326">iOS</text>
    <text class="mono note" x="519" y="374">utun</text>
    <text class="mono note" x="519" y="394">packet tunnel</text>

    <rect class="chip" x="596" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="660" y="326">FreeBSD</text>
    <text class="mono note" x="660" y="374">tun · tap</text>
    <text class="mono note" x="660" y="394">virtio header</text>

    <rect class="chip" x="737" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="801" y="326">NetBSD</text>
    <text class="mono note" x="801" y="374">tun · tap</text>

    <rect class="chip" x="878" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="942" y="326">OpenBSD</text>
    <text class="mono note" x="942" y="374">tun · tap</text>
    <text class="mono note" x="942" y="394">tun_hdr</text>

    <rect class="chip" x="1019" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="1083" y="326">illumos</text>
    <text class="mono note" x="1083" y="374">STREAMS tun</text>

    <rect class="chip" x="1160" y="292" width="128" height="56" rx="8"/>
    <text class="system" x="1224" y="326">Windows</text>
    <text class="mono note" x="1224" y="374">Wintun</text>
    <text class="mono note" x="1224" y="394">TAP-Windows</text>
  </g>

  <text class="caption" x="32" y="470">The same calls on every system, over whatever that system has for a virtual interface.</text>
</svg>
