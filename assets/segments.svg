<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" width="1320" height="860">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fff; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 30px; font-weight: 600; }
    .heading { font-size: 22px; font-weight: 500; }
    .note { font-size: 17px; fill: #9a9a9a; }
    .legend { font-size: 17px; fill: #d0d0d0; }
    .caption { font-size: 20px; font-style: italic; fill: #e6e6e6; }
    .box { stroke: #fff; stroke-opacity: 0.9; stroke-width: 1.5; }
    .vnet { fill: #F6E3A0; }
    .hdr { fill: #4F9BF7; }
    .pay { fill: #5C5C5C; }
    .dark { fill: #000; font-size: 16px; font-weight: 500; }
    .light { fill: #fff; font-size: 16px; font-weight: 500; }
    .row { fill: #9a9a9a; font-size: 16px; }
    .link { fill: none; stroke: #9a9a9a; stroke-width: 2; }
  </style>
  <defs>
    <pattern id="rewritten" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#5C5C5C"/>
      <rect width="3.5" height="9" fill="#4F9BF7"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="1320" height="860" fill="#000"/>

  <text class="title" x="32" y="48">Segments of up to 64 KiB on Linux</text>
  <rect class="box vnet" x="800" y="30" width="18" height="18" rx="2"/>
  <text class="legend" x="828" y="45">virtio_net_hdr</text>
  <rect class="box hdr" x="968" y="30" width="18" height="18" rx="2"/>
  <text class="legend" x="996" y="45">IP · TCP headers</text>
  <rect class="box pay" x="1148" y="30" width="18" height="18" rx="2"/>
  <text class="legend" x="1176" y="45">payload</text>

  <text class="heading" x="64" y="108">Read: one frame from the device, cut where it lies</text>
  <text class="mono note" x="1256" y="108" text-anchor="end">gso_size = MSS</text>

  <g dominant-baseline="central" text-anchor="middle">
    <rect class="box vnet" x="64" y="128" width="70" height="44" rx="3"/>
    <text class="dark mono" x="99" y="150">vnet</text>
    <rect class="box hdr" x="134" y="128" width="110" height="44" rx="3"/>
    <text class="dark" x="189" y="150">IP · TCP</text>
    <rect class="box pay" x="244" y="128" width="230" height="44" rx="3"/>
    <rect x="364" y="129" width="109" height="42" fill="url(#rewritten)"/>
    <text class="light" x="304" y="150">payload 0</text>
    <rect class="box pay" x="474" y="128" width="230" height="44" rx="3"/>
    <rect x="594" y="129" width="109" height="42" fill="url(#rewritten)"/>
    <text class="light" x="534" y="150">payload 1</text>
    <rect class="box pay" x="704" y="128" width="230" height="44" rx="3"/>
    <rect x="824" y="129" width="109" height="42" fill="url(#rewritten)"/>
    <text class="light" x="764" y="150">payload 2</text>
    <rect x="934" y="128" width="110" height="44" rx="3" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text class="light" x="989" y="150">…</text>
    <rect class="box pay" x="1044" y="128" width="212" height="44" rx="3"/>
    <text class="light" x="1150" y="150">payload n</text>

    <text class="row mono" x="99" y="231">#0</text>
    <rect class="box hdr" x="134" y="212" width="110" height="38" rx="3"/>
    <text class="dark" x="189" y="231">IP · TCP</text>
    <rect class="box pay" x="244" y="212" width="230" height="38" rx="3"/>
    <text class="light" x="359" y="231">payload 0</text>

    <text class="row mono" x="99" y="281">#1</text>
    <rect class="box hdr" x="364" y="262" width="110" height="38" rx="3"/>
    <text class="dark" x="419" y="281">IP · TCP</text>
    <rect class="box pay" x="474" y="262" width="230" height="38" rx="3"/>
    <text class="light" x="589" y="281">payload 1</text>

    <text class="row mono" x="99" y="331">#2</text>
    <rect class="box hdr" x="594" y="312" width="110" height="38" rx="3"/>
    <text class="dark" x="649" y="331">IP · TCP</text>
    <rect class="box pay" x="704" y="312" width="230" height="38" rx="3"/>
    <text class="light" x="819" y="331">payload 2</text>

    <text class="row mono" x="99" y="381">#n</text>
    <rect class="box hdr" x="934" y="362" width="110" height="38" rx="3"/>
    <text class="dark" x="989" y="381">IP · TCP</text>
    <rect class="box pay" x="1044" y="362" width="212" height="38" rx="3"/>
    <text class="light" x="1150" y="381">payload n</text>
  </g>
  <g stroke="#4F9BF7" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.8">
    <line x1="364" y1="172" x2="364" y2="262"/>
    <line x1="594" y1="172" x2="594" y2="312"/>
    <line x1="934" y1="172" x2="934" y2="362"/>
  </g>

  <text class="caption" x="64" y="448">Each packet's headers are written over the end of the payload before it, which was handed out</text>
  <text class="caption" x="64" y="476">already. No payload byte moves.</text>

  <text class="heading" x="64" y="540">Write: packets of one flow, joined into one segment</text>

  <g dominant-baseline="central" text-anchor="middle">
    <rect class="box hdr" x="64" y="560" width="110" height="44" rx="3" opacity="0.35"/>
    <text class="dark" x="119" y="582" opacity="0.6">IP · TCP</text>
    <rect class="box pay" x="174" y="560" width="230" height="44" rx="3"/>
    <text class="light" x="289" y="582">payload 0</text>
    <rect class="box hdr" x="64" y="612" width="110" height="44" rx="3" opacity="0.35"/>
    <text class="dark" x="119" y="634" opacity="0.6">IP · TCP</text>
    <rect class="box pay" x="174" y="612" width="230" height="44" rx="3"/>
    <text class="light" x="289" y="634">payload 1</text>
    <rect class="box hdr" x="64" y="664" width="110" height="44" rx="3" opacity="0.35"/>
    <text class="dark" x="119" y="686" opacity="0.6">IP · TCP</text>
    <rect class="box pay" x="174" y="664" width="230" height="44" rx="3"/>
    <text class="light" x="289" y="686">payload 2</text>

    <rect class="box vnet" x="640" y="612" width="70" height="44" rx="3"/>
    <text class="dark mono" x="675" y="634">vnet</text>
    <rect class="box hdr" x="710" y="612" width="110" height="44" rx="3"/>
    <text class="dark" x="765" y="634">IP · TCP</text>
    <rect class="box pay" x="820" y="612" width="145" height="44" rx="3"/>
    <text class="light" x="892" y="634">payload 0</text>
    <rect class="box pay" x="965" y="612" width="145" height="44" rx="3"/>
    <text class="light" x="1037" y="634">payload 1</text>
    <rect class="box pay" x="1110" y="612" width="145" height="44" rx="3"/>
    <text class="light" x="1182" y="634">payload 2</text>
  </g>
  <text class="mono note" x="640" y="600">one writev</text>
  <path class="link" d="M410 582 C 660 560, 892 560, 892 606" marker-end="url(#arrow)"/>
  <path class="link" d="M410 634 C 640 700, 1037 720, 1037 662" marker-end="url(#arrow)"/>
  <path class="link" d="M410 686 C 700 770, 1182 770, 1182 662" marker-end="url(#arrow)"/>

  <text class="caption" x="64" y="802">One copy of the headers is made anew; the payloads are written from where they are. The</text>
  <text class="caption" x="64" y="830">kernel takes one segment, and cutting it again gives back the same packets.</text>
</svg>
