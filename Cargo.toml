[workspace]
members = ["wire", "bench"]

[package]
name = "xtun"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "TUN and TAP interfaces on Linux, Android, the Apple systems, FreeBSD, NetBSD, OpenBSD, illumos and Windows, with batched and offloaded packet I/O"
license = "MIT"
repository = "https://github.com/kirklin/xtun"
readme = "README.md"
keywords = ["tun", "tap", "network", "wintun", "utun"]
categories = ["network-programming", "asynchronous", "os"]

[features]
default = ["tokio"]
# Asynchronous reads and writes on a Tokio runtime.
tokio = ["dep:tokio"]
# Asynchronous reads and writes on async-io, the reactor of smol and async-std.
async-io = ["dep:async-io"]
# Frames taken out of a batch as `Bytes`.
bytes = ["dep:bytes"]
# Readers as streams of packets and writers as sinks of packets.
futures = ["bytes", "dep:futures-core", "dep:futures-sink"]

[dependencies]
xtun-wire = { path = "wire", version = "0.1.0" }
async-io = { version = "2.6", optional = true }
bytes = { version = "1.12", optional = true }
futures-core = { version = "0.3.34", optional = true }
futures-sink = { version = "0.3.34", optional = true }
ipnet = "2"
tokio = { version = "1.54", features = ["net", "rt", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
io-uring = "0.7.16"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
netlink-packet-core = "0.9"
netlink-packet-route = "0.34"
netlink-sys = { version = "0.9", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
async-io = "2.6"
futures-util = { version = "0.3.34", features = ["sink"] }
tokio = { version = "1.54", features = ["full"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
