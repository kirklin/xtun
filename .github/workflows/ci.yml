# The unit tests and the device tests on every system the library has devices for, and on several
# versions of each, so that nothing comes to lean on what one version of a system happens to do.
# The device tests make real interfaces, as root or as an administrator.
#
# Linux runs on three kernels of GitHub's own machines and, in virtual machines, on the kernels of
# older and newer distributions. macOS, iOS and Windows run on the versions GitHub has. FreeBSD,
# NetBSD, OpenBSD and illumos run in virtual machines, Android on emulators.
#
# The features are every runtime and adapter, as `scripts/linux.ts` has them.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday: the machines, the images and the packages move on without a commit here.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Only these jobs, separated by spaces: linux linux-kernel macos ios windows bsd android. All of them when empty."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (${{ matrix.os }})
    if: inputs.jobs == '' || contains(format(' {0} ', inputs.jobs), ' linux ')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: System
        run: uname -srm && rustc --version
      - name: Unit tests
        run: |
          cargo test --release --locked -p xtun-wire --lib
          cargo test --release --locked --features async-io,futures --lib
      - name: Device tests
        run: >
          cargo test --release --locked --no-fail-fast --features async-io,futures
          --test device --test tap --test kernel
          --config "target.'cfg(unix)'.runner = '$PWD/scripts/ci/root.sh'"
          -- --ignored --test-threads=1 --nocapture

  # The kernels GitHub's machines do not have. The test programs are built once, linked statically,
  # and run in a virtual machine of each distribution, which needs no toolchain for them.
  linux-kernel:
    name: linux kernel (${{ matrix.guest }})
    if: inputs.jobs == '' || contains(format(' {0} ', inputs.jobs), ' linux-kernel ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The kernels: 4.18, 5.4, 5.10, 5.14, 6.1, 6.12 and the newest Fedora has.
        guest:
          - almalinux-8
          - ubuntu-20.04
          - debian-11
          - almalinux-9
          - debian-12
          - debian-13
          - fedora-45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
          rustup target add x86_64-unknown-linux-musl
      - name: Build the tests as static programs
        run: |
          programs() {
            cargo test --release --locked --target x86_64-unknown-linux-musl "$@" --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable'
          }
          mkdir -p target/ci
          programs -p xtun-wire --lib | xargs -I{} cp {} target/ci/
          programs --features async-io,futures --lib --test device --test tap --test kernel | xargs -I{} cp {} target/ci/
          ls -l target/ci
      - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        with:
          version: v2.3.0
      - name: Start the virtual machine
        run: limactl start --plain --name=default --cpus=4 --memory=4 --tty=false template://${{ matrix.guest }}
      - name: Copy the tests
        run: tar -cf - scripts/ci/root.sh -C target ci | ssh lima-default 'mkdir xtun && tar -xf - -C xtun'
      - name: Unit tests and device tests
        run: |
          ssh lima-default '
            cd xtun
            uname -srm
            status=0
            for program in ci/*; do
              case "$(basename "$program")" in
                device-* | tap-* | kernel-*) sh scripts/ci/root.sh "$program" --ignored --test-threads=1 --nocapture || status=1 ;;
                *) "$program" || status=1 ;;
              esac
            done
            exit $status
          '

  macos:
    name: macos (${{ matrix.os }})
    if: inputs.jobs == '' || contains(format(' {0} ', inputs.jobs), ' macos ')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: System
        run: sw_vers && uname -m && rustc --version
      - name: Unit tests
        run: |
          cargo test --release --locked -p xtun-wire --lib
          cargo test --release --locked --features async-io,futures --lib
      - name: Device tests
        run: >
          cargo test --release --locked --no-fail-fast --features async-io,futures
          --test device --test tap
          --config "target.'cfg(unix)'.runner = '$PWD/scripts/ci/root.sh'"
          -- --ignored --test-threads=1 --nocapture

  # The unit tests inside a simulated iPhone of the newest runtime the machine's Xcode has, and
  # the device tests as programs of that runtime.
  ios:
    name: ios (${{ matrix.os }})
    if: inputs.jobs == '' || contains(format(' {0} ', inputs.jobs), ' ios ')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rust-src --no-self-update
          rustup default stable
      # `scripts/ios.ts` takes cargo from `~/.cargo/bin`, where rustup has it on a developer's Mac.
      - name: The tools where the script looks for them
        run: |
          mkdir -p "$HOME/.cargo/bin"
          for tool in cargo rustc rustup; do
            [ -e "$HOME/.cargo/bin/$tool" ] || ln -s "$(command -v "$tool")" "$HOME/.cargo/bin/$tool"
          done
      - name: System
        run: sw_vers && xcodebuild -version && node --version && rustc --version
      - name: Unit tests and device tests
        run: node scripts/ios.ts

  windows:
    name: windows (${{ matrix.os }})
    if: inputs.jobs == '' || contains(format(' {0} ', inputs.jobs), ' windows ')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
          - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: System
        run: cmd //c ver && node --version && rustc --version --verbose
      - name: Wintun and the TAP-Windows6 driver
        run: node scripts/ci/windows.ts "$RUNNER_TEMP/xtun"
      - name: Unit tests
        run: |
          cargo test --release --locked -p xtun-wire --lib
          cargo test --release --locked --features async-io,futures --lib
      - name: Device tests
        run: >
          cargo test --release --locked --no-fail-fast --features async-io,futures
          --test windows
          -- --ignored --test-threads=1 --nocapture

  # FreeBSD, NetBSD, OpenBSD and illumos in virtual machines. OpenBSD has no Rust but its own
  # package's, which is too old for the workspace before 7.8. NetBSD has none before 10: what
  # rustup installs needs the C library of NetBSD 10, and pkgsrc builds no packages for NetBSD 9
  # any more. illumos has no TAP devices here.
  bsd:
    name: ${{ matrix.system }} ${{ matrix.version }}
    if: inputs.jobs == '' || contains(format(' {0} ', inputs.jobs), ' bsd ')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: freebsd, version: "13.5", tests: --test device --test tap }
          - { system: freebsd, version: "14.5", tests: --test device --test tap }
          - { system: freebsd, version: "15.1", tests: --test device --test tap }
          - { system: netbsd, version: "10.2", tests: --test device --test tap }
          - { system: netbsd, version: "11.1", tests: --test device --test tap }
          - { system: openbsd, version: "7.8", tests: --test device --test tap }
          - { system: openbsd, version: "7.9", tests: --test device --test tap }
          - { system: openbsd, version: "8.0", tests: --test device --test tap }
          - { system: omnios, version: r151056, tests: --test device }
          - { system: omnios, version: r151058, tests: --test device }
          - { system: omnios, version: r151060, tests: --test device }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the virtual machine
        uses: cross-platform-actions/action@30cde56b87a128507bebea9531205087890ee360 # v1.8.0
        with:
          operating_system: ${{ matrix.system }}
          version: ${{ matrix.version }}
          cpu_count: 4
          memory: 6G
          shell: sh
          sync_files: runner-to-vm
          environment_variables: CARGO_TERM_COLOR
      # What the steps that follow need in their environment goes into `~/environment`.
      - name: Rust
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: |
          set -eu
          : > "$HOME/environment"
          case "$(uname -s)" in
            OpenBSD) sudo pkg_add rust ;;
            SunOS) sudo pkg install ooce/developer/rust driver/tuntap ;;
            *)
              curl --proto '=https' --tlsv1.2 --fail --silent --show-error --output "$HOME/rustup-init.sh" https://sh.rustup.rs
              sh "$HOME/rustup-init.sh" -y --profile minimal
              echo '. "$HOME/.cargo/env"' >> "$HOME/environment"
              ;;
          esac
      # FreeBSD's devd starts a DHCP client on every Ethernet interface that appears, the TAP
      # interfaces of the tests among them: the client gives the interface an address of its own
      # and empties the system's table of neighbors under the test.
      - name: System
        shell: cpa.sh {0} --sync-files none
        run: |
          . "$HOME/environment"
          uname -a && rustc --version
          if [ "$(uname -s)" = FreeBSD ]; then sudo service devd onestop; fi
      - name: Unit tests
        shell: cpa.sh {0} --sync-files none
        run: |
          . "$HOME/environment"
          cargo test --release --locked -p xtun-wire --lib
      - name: Device tests
        shell: cpa.sh {0} --sync-files none
        run: |
          . "$HOME/environment"
          cargo test --release --locked --no-fail-fast --features async-io,futures ${{ matrix.tests }} \
            --config "target.'cfg(unix)'.runner = '$PWD/scripts/ci/root.sh'" \
            -- --ignored --test-threads=1 --nocapture

  # `scripts/android.ts` runs the tests as root in the emulator it finds running on its port. The
  # job starts that emulator, from the system image of its API level. On GitHub's machines the
  # tool that makes virtual devices and the emulator look for them in different directories
  # unless they are told one. API level 29, Android 10, is the oldest whose emulator passes the
  # tests.
  android:
    name: android (api ${{ matrix.api }})
    if: inputs.jobs == '' || contains(format(' {0} ', inputs.jobs), ' android ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
          rustup target add x86_64-linux-android
      - name: Let the emulator use the processor's virtualization
        run: sudo chown "$USER" /dev/kvm
      - name: Emulator and system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install emulator platform-tools "system-images;android-${{ matrix.api }};google_apis;x86_64" > /dev/null
      # The name of the virtual device and the port are those of `scripts/android.ts`.
      - name: Start the emulator
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name xtun_test \
            --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd xtun_test -port 5584 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          for _ in $(seq 1 120); do
            if [ "$("$adb" -s emulator-5584 shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Unit tests and device tests
        run: node scripts/android.ts
