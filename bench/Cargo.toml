[package]
name = "xtun-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "One reflector over xtun or tun-rs, to measure both the same way"

[[bin]]
name = "reflect"
path = "src/main.rs"

[[bin]]
name = "load"
path = "src/load.rs"

[dependencies]
xtun = { path = ".." }
libc = "0.2.180"
tokio = { version = "1.54", features = ["full"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tun-rs = { version = "2.8", features = ["async"] }
